# ============================================================
# XGBoost Model Training Configuration
# Affective State Recognition (Boredom, Engagement, Confusion, Frustration)
# ============================================================

# --- Data ---
data:
  features_path: "daisee_features_v2/X_features.npy"
  labels:
    boredom:     "daisee_features_v2/y_boredom.npy"
    engagement:  "daisee_features_v2/y_engagement.npy"
    confusion:   "daisee_features_v2/y_confusion.npy"
    frustration: "daisee_features_v2/y_frustration.npy"
  dataset_pkl: "daisee_features_v2/complete_dataset.pkl"
  sequence_length: 150
  num_features: 78
  # Train / val / test split ratios (must sum to 1.0)
  train_ratio: 0.80
  val_ratio:   0.10
  test_ratio:  0.10
  random_seed: 42
  # Stratification strategy for train/val/test split
  # Options:
  #   - "engagement"  : stratify on engagement labels (default, robust)
  #   - "composite"   : stratify on combined boredom+engagement+confusion+frustration
  #                     (more balanced across all states but can fail with rare combos)
  #   - any state name: e.g. "boredom", "confusion", "frustration"
  stratify_state: "engagement"

# --- Normalization ---
normalization:
  enabled: true
  strategy: "mixed"   # options: standard | minmax | robust | mixed | none

# --- Feature Engineering ---
feature_engineering:
  enabled: true
  include_statistical:  true
  include_temporal:     true
  include_frequency:    true
  include_interaction:  true
  include_domain:       true

# --- Feature Selection ---
feature_selection:
  enabled: true
  k_features: 500
  aggregation: "mean_rank"  # options: mean_rank | mean_score | max_score | sum_score
  # NEW: Multi-task feature selection with cross-task regularization
  use_multitask_lasso: false  # Use multi-task LASSO for feature selection
  combine_methods: false       # Combine XGBoost importance + LASSO (best of both)
  lasso_alpha: null           # null = auto-tune via CV, or set specific value (e.g., 0.01)

# --- Class Imbalance Handling ---
imbalance_handling:
  enabled: false               # DISABLED: SMOTE skipped
  strategy: "auto"            # Use SMOTE for minority class oversampling
  smote_k_neighbors: 5
  smote_random_state: 42
  # NEW: Use XGBoost's built-in scale_pos_weight instead of SMOTE
  use_scale_pos_weight: true
  # NEW: Cost-sensitive learning matrix (higher cost for confusing distant classes)
  cost_sensitive:
    enabled: true
    # Cost matrix: cost[i][j] = penalty for predicting j when true is i
    # For ordinal classes 0=Low, 1=Medium, 2=High
    # Higher penalty for |i-j| = 2 (e.g., Low predicted as High)
    distant_class_penalty: 3.0

# --- Threshold Optimization ---
threshold_optimization:
  enabled: true
  metric: "f1_macro"
  search_range_min: 0.1
  search_range_max: 0.9
  search_steps: 40
  # NEW: Per-class threshold optimization (one threshold per class)
  per_class_optimization: true
  # NEW: Ordinal-aware threshold optimization (respects Low < Medium < High)
  ordinal_aware: true

# --- Probability Calibration ---
calibration:
  enabled: true
  method: "sigmoid"       # Platt scaling is more robust for small/imbalanced data
  use_calibration_set: false  # Use validation set instead of separate calibration split
  calibration_ratio: 0.15  # Only used if use_calibration_set=true (deprecated)

# --- Model ---
model:
  name: "xgboost"
  num_classes: 3
  use_gpu: true

# --- XGBoost Hyperparameters ---
xgboost:
  objective: "multi:softprob"
  max_depth: 8
  learning_rate: 0.05
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  verbosity: 0
  early_stopping_rounds: 50

# --- Two-Stage Classification (for extreme imbalance) ---
two_stage:
  enabled: true
  stage1_binary: true        # true = Low(0) vs Not-Low(1,2), false = Low+Medium(0,1) vs High(2)
  stage1_objective: "binary:logistic"
  stage2_objective: "binary:logistic"
  # Separate hyperparameters for each stage (optimized for imbalanced binary)
  stage1_max_depth: 6
  stage1_n_estimators: 300
  stage2_max_depth: 6
  stage2_n_estimators: 300

# --- Focal Loss (for class imbalance) ---
focal_loss:
  enabled: false       # DISABLED: Use scale_pos_weight + cost-sensitive learning instead
  alpha: 0.25          # Weighting factor (0.25 = slight down-weighting of easy examples)
  gamma: 2.0           # Focusing parameter (2.0 = moderate focus on hard examples)

# --- Evaluation ---
evaluation:
  # Affective states to evaluate
  states:
    - boredom
    - engagement
    - confusion
    - frustration
  # Feature importance top-k features to report
  feature_importance_top_k: 20
  feature_importance_type: "gain"   # options: gain | weight | cover
  # NEW: Per-class metrics reporting (diagnose minority class failure)
  per_class_metrics: true
  class_names: ["Low", "Medium", "High"]
  # NEW: Track class distribution in predictions vs ground truth
  report_class_distribution: true

# --- Feature Importance Analysis (Two-Stage) ---
feature_importance:
  enabled: true                    # Enable two-stage feature importance analysis

  # Stage 1: SHAP Analysis
  shap:
    background_samples: 100        # Background dataset size for SHAP explainer
    sample_size: 200              # Number of samples to explain (null = all)
    max_display_features: 30       # Max features to display in plots
    compute_interactions: false    # Compute SHAP interaction values (slow)

  # Stage 2: Permutation Importance
  permutation:
    n_repeats: 10                 # Number of permutation repeats
    scoring: "f1_macro"            # Metric for importance ('f1_macro', 'f1_weighted', 'accuracy')
    n_jobs: -1                    # Parallel jobs (-1 = all cores)

  # Analysis Options
  top_k: 50                        # Number of top features to analyze
  compare_states: true            # Compare importance across states
  identify_stable: true           # Find stable features across methods

  # Output Options
  output_subdir: "feature_importance"
  save_shap_values: true          # Save raw SHAP values (.npy)
  generate_report: true           # Generate JSON summary report
  generate_plots: true            # Generate visualization plots

# --- Output ---
output:
  base_dir: "outputs_v2"
  # Checkpoint filename saved inside checkpoints/
  checkpoint_filename: "final_model.pt"
  # TensorBoard logging (not applicable for XGBoost, set to false)
  tensorboard: false
