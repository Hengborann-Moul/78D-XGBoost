# ============================================================
# XGBoost Model Training Configuration
# Affective State Recognition (Boredom, Engagement, Confusion, Frustration)
# ============================================================

# --- Data ---
data:
  features_path: "daisee_features_v2/X_features.npy"
  labels:
    boredom:     "daisee_features_v2/y_boredom.npy"
    engagement:  "daisee_features_v2/y_engagement.npy"
    confusion:   "daisee_features_v2/y_confusion.npy"
    frustration: "daisee_features_v2/y_frustration.npy"
  dataset_pkl: "daisee_features_v2/complete_dataset.pkl"
  sequence_length: 150
  num_features: 78
  # Train / val / test split ratios (must sum to 1.0)
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  random_seed: 42

# --- Normalization ---
normalization:
  enabled: true
  strategy: "mixed"   # options: standard | minmax | robust | mixed | none

# --- Feature Engineering ---
feature_engineering:
  enabled: true
  include_statistical:  true
  include_temporal:     true
  include_frequency:    true
  include_interaction:  true
  include_domain:       true

# --- Feature Selection ---
feature_selection:
  enabled: true
  k_features: 2000
  aggregation: "mean_rank"  # options: mean_rank | mean_score | max_score | sum_score
  # NEW: Multi-task feature selection with cross-task regularization
  use_multitask_lasso: false  # Use multi-task LASSO for feature selection
  combine_methods: true       # Combine XGBoost importance + LASSO (best of both)
  lasso_alpha: null           # null = auto-tune via CV, or set specific value (e.g., 0.01)

# --- Class Imbalance Handling ---
imbalance_handling:
  enabled: true
  strategy: "smote"            # Use SMOTE for minority class oversampling
  smote_k_neighbors: 5
  smote_random_state: 42

# --- Threshold Optimization ---
threshold_optimization:
  enabled: true
  metric: "f1_macro"
  search_range_min: 0.2
  search_range_max: 0.8
  search_steps: 20

# --- Probability Calibration ---
calibration:
  enabled: true
  method: "isotonic"      # options: isotonic | sigmoid
  use_calibration_set: true
  calibration_ratio: 0.15  # held out from training for calibration

# --- Model ---
model:
  name: "xgboost"
  num_classes: 3
  use_gpu: true

# --- XGBoost Hyperparameters ---
xgboost:
  objective: "multi:softprob"
  max_depth: 8
  learning_rate: 0.05
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.1       # L1 regularization
  reg_lambda: 1.0      # L2 regularization
  random_state: 42
  n_jobs: -1
  verbosity: 0
  early_stopping_rounds: 50

# --- Focal Loss (for class imbalance) ---
focal_loss:
  enabled: true        # Enable focal loss objective (recommended for imbalanced data)
  alpha: 0.25          # Weighting factor (0.25 = slight down-weighting of easy examples)
  gamma: 2.0           # Focusing parameter (2.0 = moderate focus on hard examples)

# --- Evaluation ---
evaluation:
  # Affective states to evaluate
  states:
    - boredom
    - engagement
    - confusion
    - frustration
  # Feature importance top-k features to report
  feature_importance_top_k: 20
  feature_importance_type: "gain"   # options: gain | weight | cover

# --- Output ---
output:
  base_dir: "outputs_v2"
  # Checkpoint filename saved inside checkpoints/
  checkpoint_filename: "final_model.pt"
  # TensorBoard logging (not applicable for XGBoost, set to false)
  tensorboard: false
