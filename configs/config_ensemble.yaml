# ============================================================
# Ensemble Model Training Configuration
# LSTM + XGBoost Hybrid for Affective State Recognition
# (Boredom, Engagement, Confusion, Frustration)
# ============================================================

# --- Data ---
data:
  features_path: "daisee_features_v2/X_features.npy"
  labels:
    boredom:     "daisee_features_v2/y_boredom.npy"
    engagement:  "daisee_features_v2/y_engagement.npy"
    confusion:   "daisee_features_v2/y_confusion.npy"
    frustration: "daisee_features_v2/y_frustration.npy"
  dataset_pkl: "daisee_features_v2/complete_dataset.pkl"
  sequence_length: 150
  num_features: 78
  # Train / val / test split ratios (must sum to 1.0)
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  random_seed: 42

# --- Normalization ---
normalization:
  enabled: true
  strategy: "mixed"   # options: standard | minmax | robust | mixed | none

# ============================================================
# LSTM Sub-model
# ============================================================
lstm:
  # Architecture
  model:
    input_dim: 78
    hidden_dim: 256
    num_layers: 2
    num_classes: 3
    dropout: 0.3
    bidirectional: true
    use_attention: true
    use_projection: true

  # Loss
  loss:
    use_focal_loss: true
    num_classes: 3

  # Training
  training:
    batch_size: 32
    num_epochs: 100
    learning_rate: 0.001
    weight_decay: 0.01
    grad_clip_norm: 1.0
    patience: 15
    use_weighted_sampler: true
    num_workers: 4

  # LR Scheduler
  scheduler:
    name: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.5
    patience: 5

# ============================================================
# XGBoost Sub-model
# ============================================================
xgboost:
  # Feature Engineering
  feature_engineering:
    enabled: true
    include_statistical:  true
    include_temporal:     true
    include_frequency:    true
    include_interaction:  true
    include_domain:       true

  # Model
  model:
    num_classes: 3
    use_gpu: true

  # XGBoost Hyperparameters
  params:
    objective: "multi:softprob"
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 500
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    gamma: 0.1
    reg_alpha: 0.1       # L1 regularization
    reg_lambda: 1.0      # L2 regularization
    random_state: 42
    n_jobs: -1
    verbosity: 0
    early_stopping_rounds: 50

# ============================================================
# Ensemble
# ============================================================
ensemble:
  # Weights for weighted-average probability fusion (must sum to 1.0).
  # Set search_optimal_weights: true to override these with val-set search.
  lstm_weight: 0.6
  xgb_weight:  0.4

  # Grid-search optimal weights on the validation set before final evaluation.
  # The best weights found replace lstm_weight / xgb_weight above.
  search_optimal_weights: true
  # State used to optimise weights during grid search
  weight_search_state: "engagement"
  # Grid resolution: weights are swept from 0.0 to 1.0 in steps of step_size
  weight_search_step: 0.05

# ============================================================
# Evaluation
# ============================================================
evaluation:
  batch_size: 64
  states:
    - boredom
    - engagement
    - confusion
    - frustration

# ============================================================
# Output
# ============================================================
output:
  base_dir: "outputs_v2"
  # Filenames inside checkpoints/
  lstm_checkpoint:    "lstm_model.pt"
  xgboost_checkpoint: "xgboost_model.pt"
  # TensorBoard logging for the LSTM sub-model training
  tensorboard: true
